<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAFIDON</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    width:100%;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(rgba(4,10,25,.45),rgba(4,10,25,.65)),
    url("photo.luch.jpeg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    font-family:Tahoma,Arial,sans-serif;

}

.container{

    text-align:center;

}

.logo{

    width:180px;
    max-width:45vw;
    height:auto;

    filter:drop-shadow(0 8px 20px rgba(0,0,0,.5));

}

@media(max-width:768px){

body{

    background-position:center;
    background-size:cover;
    background-attachment:scroll;

}

.logo{

    width:130px;

}

}

</style>

</head>

<body>

<div class="container">

<img src="logo.png.jpeg" class="logo" alt="RAFIDON">

</div>

</body>

</html>
