<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAFIDON</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(rgba(5,15,35,.45),rgba(5,15,35,.60)),
    url("photo.luch.jpeg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    font-family:Tahoma,Arial,sans-serif;

}

.logo{

    width:170px;
    max-width:45vw;
    height:auto;

    filter:drop-shadow(0 8px 25px rgba(0,0,0,.6));

    transition:.3s;

}

.logo:hover{

    transform:scale(1.05);

}

@media (max-width:768px){

body{

    background-attachment:scroll;

}

.logo{

    width:120px;

}

}

</style>

</head>

<body>

<img src="logo.png" class="logo" alt="RAFIDON">

</body>

</html>
